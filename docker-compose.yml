services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: 
      .env
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
    ports:
      - 1972:1972
      - 52773:52773
      - 8080:8080
    volumes:
      - ./:/home/irisowner/dev
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
      - "1110:1110"
    environment:
      MP_POP3_AUTH: "iris:test123"